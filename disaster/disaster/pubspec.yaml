name: disaster
description: "Real-time Disaster Alert mobile app with offline-first SQLite storage, GPS proximity alerts, SOS and live map."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  sqflite_common_ffi_web: ^1.2.0
  cupertino_icons: ^1.0.8

  # Local SQLite database (offline-first)
  sqflite: ^2.4.1
  path: ^1.9.0
  path_provider: ^2.1.5

  # Networking
  http: ^1.2.2
  web_socket_channel: ^3.0.1
  connectivity_plus: ^7.0.0

  # Location / GPS
  geolocator: ^14.0.1

  # Notifications
  flutter_local_notifications: ^22.0.0

  # Secure storage (tokens / secrets)
  flutter_secure_storage: ^11.0.0

  # State management
  provider: ^6.1.2

  # Live map (keyless OpenStreetMap based, no hard-coded API keys)
  flutter_map: ^8.2.0
  latlong2: ^0.10.0

  # Utilities
  shared_preferences: ^2.3.3
  url_launcher: ^6.3.1
  uuid: ^4.5.1
  intl: ^0.20.1
  crypto: ^3.0.6
  xml: ^7.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.3.7
  sqlite3: ^3.5.0

flutter:
  uses-material-design: true
  assets:
    - assets/config/data_sources.json